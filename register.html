<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب | موثوق</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="register">
<header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">م</span>موثوق</a><a href="login.html">لديك حساب؟ تسجيل الدخول</a></div></header>
<main class="auth-wrap"><section class="auth-card"><span class="eyebrow">ابدأ الآن</span><h1>إنشاء حساب</h1><p class="muted">اختر نوع حسابك أولًا.</p>
<div class="role-switch"><button class="role active" data-role="seeker">طالب خدمة</button><button class="role" data-role="provider">مقدم خدمة</button></div>
<form id="registerForm">
<label>الاسم الكامل<input name="name" required placeholder="مثال: أحمد محمد"></label>
<label>البريد الإلكتروني<input type="email" name="email" required placeholder="name@example.com"></label>
<label>رقم الهاتف<input name="phone" required placeholder="+968 9XXXXXXX"></label>
<label>كلمة المرور<input type="password" name="password" required minlength="8" placeholder="8 أحرف على الأقل"></label>
<label class="check"><input type="checkbox" required> أوافق على الشروط وسياسة الاستخدام المسؤول</label>
<button class="btn btn-primary btn-lg full" type="submit">إنشاء الحساب</button>
</form><div id="registerMsg" class="form-msg"></div></section></main>
<script src="js/app.js"></script></body></html>
