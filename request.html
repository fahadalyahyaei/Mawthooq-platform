<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب خدمة | موثوق</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="request">
<header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">م</span>موثوق</a><a href="dashboard.html">لوحة التحكم</a></div></header>
<main class="section"><div class="container narrow"><section class="panel"><span class="eyebrow">طلب خدمة</span><h1>أنشئ طلبك بالتفصيل</h1>
<form id="requestForm" class="form-grid">
<label>عنوان الطلب<input name="title" required placeholder="مثال: تحليل استبانة بحثية"></label>
<label>نوع الخدمة<select name="category" required><option value="">اختر</option><option>الإطار النظري</option><option>الدراسات السابقة</option><option>المنهجية</option><option>التحليل الإحصائي</option><option>التدقيق والمراجعة</option><option>التنسيق</option><option>الترجمة الأكاديمية</option><option>الاستشارات البحثية</option></select></label>
<label class="full-span">وصف الطلب<textarea name="description" rows="6" required placeholder="اشرح المطلوب، حجم العمل، الأدوات، والمخرجات المتوقعة..."></textarea></label>
<label>الميزانية (ر.ع)<input type="number" name="budget" min="0" step="0.5" required></label>
<label>الموعد المطلوب<input type="date" name="dueDate" required></label>
<label class="full-span">رابط/اسم الملف (اختياري)<input name="attachment" placeholder="في النسخة الكاملة سيتم رفع الملفات بأمان"></label>
<label class="check full-span"><input type="checkbox" required> أؤكد أن الطلب لا يتضمن انتحالًا أو تقديم عمل شخص آخر باعتباره عملي الشخصي.</label>
<button class="btn btn-primary btn-lg full-span" type="submit">نشر الطلب</button>
</form><div id="requestMsg" class="form-msg"></div></section></div></main><script src="js/app.js"></script></body></html>
